<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Static Form UI Demo</title>
	<link rel="stylesheet" href="password-demo.css">
</head>
<body>
	<main class="card">
		<p class="eyebrow">LOCAL UI DEMO</p>
		<h1>Password form</h1>
		<p class="description">A static styling example. This page does not submit or send data.</p>
		<div class="field">
			<label for="new-password">New password</label>
			<input id="new-password" type="password" placeholder="Enter a sample password" autocomplete="off">
		</div>
		<button type="button">Preview button</button>
		<p class="note">Demo only · No request will be sent</p>
	</main>
</body>
</html>
